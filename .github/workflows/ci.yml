name: quality-security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m bandit -r app -lll
      - run: python -m pip_audit -r requirements-dev.txt
      - run: python -m pytest
      - run: node --check app/static/app.js
      - run: node --test tests/frontend.test.cjs
